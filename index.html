<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGS Yıldız Haritası</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;color:#e9ecff;font:16px/1.4 'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 background:radial-gradient(1200px 800px at 15% 5%,#1a1247,transparent 60%),radial-gradient(900px 700px at 90% 85%,#0c2a4d,transparent 60%),#04050d;
 -webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;touch-action:manipulation}
canvas{position:fixed;inset:0;pointer-events:none}
#sky{z-index:0}#fx{z-index:100}
.neb{position:fixed;inset:-20%;z-index:0;pointer-events:none;animation:drift 40s ease-in-out infinite alternate;
 background:radial-gradient(40% 30% at 30% 40%,rgba(120,70,255,.22),transparent 70%),radial-gradient(35% 30% at 70% 60%,rgba(0,190,255,.16),transparent 70%),radial-gradient(30% 25% at 55% 15%,rgba(255,80,170,.13),transparent 70%)}
@keyframes drift{to{transform:translate(4%,3%) rotate(6deg) scale(1.08)}}
.fl{position:fixed;left:-80px;z-index:1;font-size:30px;opacity:.85;pointer-events:none;animation:fly linear infinite}
@keyframes fly{to{transform:translateX(calc(100vw + 160px)) rotate(25deg)}}
.gas{position:fixed;right:-70px;bottom:8%;width:220px;height:220px;border-radius:50%;z-index:1;pointer-events:none;opacity:.55;
 background:radial-gradient(circle at 30% 30%,#ffd9a0,#c8703a 45%,#3a1a12);box-shadow:inset -22px -18px 40px rgba(0,0,0,.6);animation:bob 9s ease-in-out infinite}
.gas::before{content:"";position:absolute;left:-40%;right:-40%;top:42%;height:16%;border:5px solid rgba(255,220,170,.55);border-radius:50%;transform:rotate(-16deg)}
@keyframes bob{50%{transform:translateY(-14px)}}
.app{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.ov{flex:1;min-width:220px}
.ob{position:relative;height:8px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:10px}
#ob{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#7c5cff,#3ec6ff,#7dffb5);transition:width .9s cubic-bezier(.2,.8,.2,1)}
#rk{position:absolute;top:50%;left:0;translate:-50% -50%;font-size:22px;transition:left .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px #7cf)}
#ot{font-size:13px;color:#aab3e0}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid rgba(150,170,255,.35);background:rgba(20,24,60,.6);cursor:pointer;transition:all .2s}
.btn:hover{border-color:#9fb0ff;box-shadow:0 0 16px rgba(120,140,255,.4);transform:translateY(-1px)}
.btn:active{transform:scale(.95)}
.view{display:none}
.view.show{display:block;animation:vin .6s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:scale(.93);filter:blur(8px)}}
.hint{margin:0 0 14px;color:#aab3e0;font-size:14px}

/* Açılan tablo */
.table{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(150,170,255,.25);border:1px solid rgba(150,170,255,.4);border-radius:22px;overflow:hidden;box-shadow:0 0 70px rgba(90,80,255,.25);animation:unfold 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes unfold{0%{clip-path:inset(49.5% 0 49.5% 0);opacity:0}25%{clip-path:inset(49.5% 0 49.5% 0);opacity:1}100%{clip-path:inset(0 round 22px)}}
.cell{--c:hsl(var(--h) 90% 68%);position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:220px;padding:22px 20px 18px;border:0;cursor:pointer;
 background:rgba(8,10,28,.74);backdrop-filter:blur(6px);animation:pop .7s cubic-bezier(.2,1.5,.4,1) calc(.7s + var(--i)*90ms) both;transition:background .3s}
@keyframes pop{from{opacity:0;scale:.6}}
.cell:hover{background:hsl(var(--h) 50% 13% / .85);animation:wob .6s ease}
@keyframes wob{25%{rotate:-1.2deg;translate:0 -4px}60%{rotate:1deg}}
.planet{position:relative;flex:0 0 auto;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;margin-bottom:8px;
 background:radial-gradient(circle at 30% 28%,hsl(var(--h) 95% 75%),hsl(var(--h) 70% 38%) 55%,hsl(var(--h) 60% 14%));
 box-shadow:0 0 28px hsl(var(--h) 90% 55%/.5),inset -8px -8px 16px rgba(0,0,0,.45);animation:bob 5s ease-in-out infinite;transition:scale .3s}
.cell:hover .planet{scale:1.14}
.moon{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#dfe6ff;box-shadow:0 0 8px #fff;animation:orbit 4s linear infinite}
.cell:hover .moon{animation-duration:1.5s}
@keyframes orbit{from{transform:rotate(0) translateX(44px)}to{transform:rotate(360deg) translateX(44px)}}
.ttl{font-size:18px;font-weight:600;line-height:1.25}
.ttl .w{display:inline-block;white-space:nowrap}
.ttl i{display:inline-block;font-style:normal}
.cell:hover .ttl i{animation:wv .6s ease calc(var(--k)*40ms)}
@keyframes wv{40%{transform:translateY(-6px) rotate(-5deg);color:var(--c)}}
.sub{font-size:13px;color:#aab3e0}
.cnt{margin-top:auto;font-size:14px;color:var(--c);font-weight:600}
.rgw{position:absolute;top:14px;right:14px;width:56px;height:56px;display:grid;place-items:center}
.rgw b{position:absolute;font-size:12px}
.cell.done::after{content:"🌟";position:absolute;right:16px;bottom:14px;font-size:22px;animation:bob 2s ease-in-out infinite}
.rg{width:100%;height:100%;rotate:-90deg}
.tr{fill:none;stroke:rgba(255,255,255,.13);stroke-width:4}
.pg{fill:none;stroke:var(--c,#7dd3fc);stroke-width:4;stroke-linecap:round;stroke-dasharray:138.2;stroke-dashoffset:138.2;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1);animation:ringIn 1.3s ease-out .9s backwards}
@keyframes ringIn{from{stroke-dashoffset:138.2}}

/* Kavram haritası */
#mapv{--c:hsl(var(--h) 90% 68%)}
.mtop{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.mtop h2{margin:0;font-size:20px}
.stage{position:relative;display:grid;grid-template-columns:minmax(0,620px) minmax(0,1fr);gap:56px;align-items:start}
.mz{position:relative;width:100%;aspect-ratio:1;container-type:inline-size;z-index:2}
.br{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.brn{fill:none;stroke:hsl(var(--h) 80% 60%/.35);stroke-width:.45;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out var(--d) forwards}
.brn.lit{stroke:hsl(var(--h) 95% 70%);filter:drop-shadow(0 0 3px hsl(var(--h) 95% 60%))}
@keyframes draw{to{stroke-dashoffset:0}}
.core{position:absolute;left:50%;top:50%;translate:-50% -50%;width:150px;text-align:center;animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
.core .planet{width:76px;height:76px;font-size:36px;margin:0 auto 6px}
.core b{display:block;font-size:15px;text-shadow:0 0 10px #000,0 0 4px #000}
.core small{color:var(--c);font-weight:600;text-shadow:0 0 8px #000}
.gn{position:absolute;translate:-50% -50%;width:58px;height:58px;padding:0;border:0;border-radius:50%;cursor:pointer;background:rgba(10,12,34,.9);
 box-shadow:0 0 0 1px rgba(255,255,255,.16);animation:nin .6s cubic-bezier(.2,1.6,.4,1) var(--d) backwards;transition:scale .25s,box-shadow .25s,background .3s}
@keyframes nin{from{scale:0;opacity:0}}
.gn .rg{position:absolute;inset:0}
.gn b{position:relative;font-size:12px}
.gn:hover{scale:1.12}
.gn.sel{scale:1.2;box-shadow:0 0 0 2px var(--c),0 0 26px var(--c);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--c),0 0 40px var(--c)}}
.gn.full{background:hsl(var(--h) 55% 22%)}
.gn.full::after{content:"✨";position:absolute;right:-6px;top:-8px;font-size:16px}
.gl{position:absolute;top:100%;left:50%;translate:-50% 0;width:100px;margin-top:6px;text-align:center;font-size:11px;font-weight:500;line-height:1.2;color:#c9d0f5;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;pointer-events:none}
.gn.sel .gl{color:#fff;-webkit-line-clamp:4}
@container (max-width:480px){.gl{display:none}.gn.sel .gl{display:-webkit-box}}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.lk{fill:none;stroke:hsl(var(--h) 80% 65%/.45);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease-out var(--d) forwards;transition:stroke .3s}
.lk.on{stroke:hsl(var(--h) 100% 72%);filter:drop-shadow(0 0 4px hsl(var(--h) 100% 60%))}
.panel{position:relative;z-index:2;padding:16px;border-radius:20px;background:rgba(8,10,28,.58);border:1px solid rgba(150,170,255,.28);backdrop-filter:blur(6px)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.ph h3{margin:0;font-size:17px;line-height:1.25}
.ph small{color:var(--c);font-weight:600}
.lv{list-style:none;margin:0;padding:0}
.leaf{display:flex;align-items:center;gap:14px;min-height:54px;padding:8px 14px;margin:0 0 8px;border-radius:14px;cursor:pointer;background:rgba(14,17,46,.85);border:1px solid rgba(150,170,255,.2);
 animation:lin .5s ease-out calc(var(--j)*45ms) both;transition:background .2s,border-color .2s,translate .2s}
@keyframes lin{from{opacity:0;filter:blur(6px)}}
.leaf:hover{border-color:var(--c);translate:4px 0}
.bx{flex:0 0 28px;height:28px;border-radius:9px;border:2px solid #7c86b8;display:grid;place-items:center;transition:all .2s}
.leaf.on .bx{background:var(--c);border-color:var(--c);box-shadow:0 0 14px var(--c);animation:tick .45s}
.leaf.on .bx::after{content:"✓";color:#06081a;font-weight:800;font-size:18px}
@keyframes tick{40%{scale:1.5;rotate:-12deg}}
.leaf.on{background:hsl(var(--h) 40% 14%/.9)}
.leaf.on .lt{color:#9aa3cf;text-decoration:line-through}
.lt{flex:1}
.dl{border:0;background:none;color:#9aa3cf;font-size:16px;min-width:40px;min-height:40px;cursor:pointer}
.add{display:flex;gap:8px;margin-top:6px}
.add input{flex:1;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid rgba(150,170,255,.35);background:rgba(8,10,28,.8);color:inherit;font:inherit}
.empty{color:#aab3e0;font-size:14px;margin:0 0 10px}
.modal{position:fixed;inset:0;z-index:150;display:none;place-items:center;background:rgba(2,3,10,.7);backdrop-filter:blur(4px)}
.modal.show{display:grid;animation:vin .3s}
.mb{width:min(520px,92vw);padding:20px;border-radius:20px;background:#0c1030;border:1px solid rgba(150,170,255,.35)}
.mb h3{margin:0 0 6px}.mb p{margin:0 0 10px;color:#aab3e0;font-size:14px}
.mb textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid rgba(150,170,255,.3);background:#070920;color:inherit;font:12px ui-monospace,Menlo,monospace;padding:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);translate:-50% 20px;z-index:200;padding:10px 18px;border-radius:99px;background:#e9ecff;color:#06081a;font-weight:600;opacity:0;pointer-events:none;transition:all .3s}
#toast.show{opacity:1;translate:-50% 0}
button:focus-visible{outline:3px solid #9fb0ff;outline-offset:2px}
@media (max-width:900px){.stage{grid-template-columns:1fr;gap:24px}.mz{max-width:540px;margin:0 auto}.table{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.table{grid-template-columns:1fr}.cell{min-height:170px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.fl{display:none}}
</style>
</head>
<body>
<div class="neb"></div><canvas id="sky"></canvas><canvas id="fx"></canvas>
<span class="fl" style="top:14%;animation-duration:80s">🛰️</span>
<span class="fl" style="top:68%;animation-duration:120s;animation-delay:-40s">🪐</span>
<span class="fl" style="top:40%;animation-duration:55s;animation-delay:-15s">☄️</span>
<span class="fl" style="top:86%;animation-duration:95s;animation-delay:-60s">👨‍🚀</span>
<div class="gas"></div>
<div class="app">
  <header>
    <h1>AGS Yıldız Haritası</h1>
    <div class="ov"><div id="ot"></div><div class="ob"><div id="ob"></div><span id="rk">🚀</span></div></div>
    <button class="btn" id="bk" type="button">⚙ Yedek</button>
  </header>
  <section class="view show" id="home">
    <p class="hint">Bir gezegene dokun, konu haritası açılsın.</p>
    <div class="table" id="table"></div>
  </section>
  <section class="view" id="mapv">
    <div class="mtop"><button class="btn" id="back" type="button">← Gezegenler</button><h2 id="mt"></h2></div>
    <div class="stage" id="stage">
      <div class="mz" id="mz"></div>
      <aside class="panel" id="panel"></aside>
      <svg id="ov"></svg>
    </div>
  </section>
</div>
<div class="modal" id="md"><div class="mb">
  <h3>Yedekle / başka cihaza aktar</h3>
  <p>“Kodu oluştur”a bas, kodu kopyala; diğer cihazda buraya yapıştırıp “Kodu yükle”ye bas. <span id="sy">Bu cihazda kayıtlı.</span></p>
  <textarea id="cd" spellcheck="false"></textarea>
  <div class="acts"><button class="btn" id="mk" type="button">Kodu oluştur</button><button class="btn" id="ld" type="button">Kodu yükle</button><button class="btn" id="rs" type="button">Tüm işaretleri sıfırla</button><button class="btn" id="cl" type="button">Kapat</button></div>
</div></div>
<div id="toast"></div>
<script>
/* Bölümler > ÖSYM resmî alt alanları > çalışma alt başlıkları */
var SECTIONS = [
  {id:'sozel-yetenek', title:'Sözel Yetenek', pct:'%18,75', q:15, groups:[
    {t:'Sözcükte Anlam', c:['Gerçek, mecaz ve terim anlam','Eş, zıt ve yakın anlamlı sözcükler','Deyim ve atasözlerinin anlamı','Çok anlamlılık ve bağlama göre anlam','Sözcük gruplarında anlam ilişkileri','Verilen ifadenin yerine kullanılabilecek sözcük seçimi']},
    {t:'Cümlede Anlam', c:['Cümlenin ana yargısı','Neden-sonuç, koşul ve amaç bildiren cümleler','Karşılaştırma ve çıkarım yapma','Öznel ve nesnel yargılar','Cümleleri anlamca karşılaştırma','Örtük anlam ve varsayımlar']},
    {t:'Anlatımın Oluşması', c:['Cümleleri doğru sıraya dizme','Paragrafta akışı bozan cümleyi bulma','Boşluğa uygun ifadeyi yerleştirme','Paragrafı iki bölüme ayırma','Cümleler arası bağlantı ve geçiş ifadeleri']},
    {t:'Paragrafta Anlam', c:['Konu ve ana düşünce','Yardımcı düşünceler','Paragrafa başlık bulma','Yazarın tutumu ve amacı','Anlatım biçimleri','Düşünceyi geliştirme yolları','Paragrafın yapısı ve dil özellikleri']},
    {t:'Sözel Mantık', c:['Sıralama ve yerleştirme','Eşleştirme ve gruplama','Koşullu önermeler','Tablo veya şema çizerek çözme','Kesin, olası ve imkânsız durumlar']}
  ]},
  {id:'sayisal-yetenek', title:'Sayısal Yetenek', pct:'%18,75', q:15, groups:[
    {t:'Temel Matematik', c:['Dört işlem ve işlem önceliği','Sayı basamakları, bölme ve kalan','Rasyonel ve ondalık sayılar','Üslü ve köklü sayılar','Mutlak değer ve eşitsizlikler','Oran ve orantı','Yüzde hesapları','Birinci dereceden denklemler','Yaş problemleri','Hareket problemleri','İşçi ve havuz problemleri','Kâr-zarar ve indirim problemleri','Karışım problemleri','Sayı ve kesir problemleri']},
    {t:'Grafik ve Tablo Yorumlama', c:['Sütun, çizgi ve daire grafiklerini okuma','Tablolardaki verileri karşılaştırma','Yüzde artış ve azalışı hesaplama','Ortalama ve toplam bulma','Birden fazla grafiği birlikte yorumlama','Verilerden kesin sonuç çıkarma']},
    {t:'Mantıksal Muhakeme Problemleri', c:['Sayı örüntüleri','Koşullara göre yerleştirme','Sıralama ve dağıtım','En az ve en çok durumları','Çok adımlı çıkarım soruları']}
  ]},
  {id:'tarih', title:'Tarih', pct:'%7,5', q:6, groups:[
    {t:'Osmanlı Öncesi Türk Devletleri Tarihi', c:['İslamiyet öncesi Türk devletleri','Devlet yönetimi ve toplum düzeni','Türk kültürü ve inanç sistemi','İlk Türk-İslam devletleri','Büyük Selçuklu Devleti','Anadolu Selçuklu Devleti ve beylikler']},
    {t:'Osmanlı Tarihi', c:['Kuruluş dönemi','Fetihler ve yükselme','Devlet teşkilatı ve toprak düzeni','Ekonomi ve toplum yapısı','Duraklama ve gerileme, ıslahatlar','Yenileşme hareketleri ve Tanzimat','Meşrutiyet dönemleri','Osmanlı kültür ve sanatı','Savaşlar: Balkanlar, Trablusgarp, Birinci Dünya Savaşı']},
    {t:'Atatürk İlkeleri ve İnkılap Tarihi', c:['Mondros ve işgallerin başlaması','Cemiyetler ve Kuvayımilliye','Kongreler ve Misakımillî','TBMM dönemi ve cepheler','Mudanya ve Lozan','İnkılaplar','Atatürk ilkeleri','İç ve dış politika gelişmeleri']},
    {t:'Çağdaş Türk ve Dünya Tarihi', c:['İki dünya savaşı arası dönem','İkinci Dünya Savaşı','Soğuk Savaş','Türkiye’nin uluslararası ilişkileri','Kıbrıs meselesi','Blok çözülmesi ve Türk dünyası','Küreselleşme']}
  ]},
  {id:'turkiye-cografyasi', title:'Türkiye Coğrafyası', pct:'%7,5', q:6, groups:[
    {t:'Türkiye Fiziki Coğrafyası', c:['Konum ve sonuçları','Yerel saat hesapları','Yer şekilleri ve oluşumu','İklim özellikleri','Akarsu, göl ve denizler','Toprak ve bitki örtüsü','Doğal afetler']},
    {t:'Türkiye Beşerî ve Ekonomik Coğrafyası', c:['Nüfus ve dağılışı','Göçler','Kır ve kent yerleşmeleri','Tarım ürünleri','Hayvancılık, ormancılık ve balıkçılık','Madenler ve enerji','Sanayi','Ulaşım ve ticaret','Turizm']}
  ]},
  {id:'egitim-bilimleri', title:'Eğitim Bilimleri ve Türk Millî Eğitim Sistemi', short:'Eğitim Bilimleri', pct:'%37,5', q:30, groups:[
    {t:'Eğitimin Tarihî, Felsefi, Toplumsal, Ekonomik ve Politik Temelleri', c:['Türk eğitim tarihi','Felsefi akımlar ve eğitime etkileri','Toplum, kültür ve eğitim ilişkisi','Eğitimin ekonomik yönü','Politik temeller ve eğitim politikaları','Fırsat eşitliği ve toplumsal değişim']},
    {t:'Öğretim Yöntem ve Teknikleri', c:['Öğretim ilkeleri','Stratejiler','Anlatım, tartışma ve gösteri yöntemleri','Problem çözme ve örnek olay','Beyin fırtınası ve soru-cevap teknikleri','İş birlikli öğrenme','Proje ve bireysel çalışma','Yöntem seçerken dikkat edilecekler']},
    {t:'Sınıf Yönetimi', c:['Sınıf yönetimi yaklaşımları','Fiziksel ortam ve zaman kullanımı','Kural ve düzen oluşturma','Sınıf içi iletişim','Davranış sorunlarıyla başa çıkma','Motivasyon ve katılım','Çatışma yönetimi']},
    {t:'Program Okuryazarlığı', c:['Programın ögeleri','Hedef ve kazanımlar','İçerik seçimi ve düzenleme','Öğrenme-öğretme süreci','Programda değerlendirme','Program geliştirme adımları','Gizli program','Program değerlendirme yaklaşımları']},
    {t:'Eğitimde Ölçme ve Değerlendirme', c:['Temel kavramlar','Ölçek türleri','Geçerlik ve güvenirlik','Madde analizi','Temel istatistik','Bağıl ve mutlak değerlendirme','Test türleri ve soru yazma','Rubrik, portfolyo ve performans görevleri']},
    {t:'Öğrenme Psikolojisi', c:['Davranışçı kuramlar','Bilişsel kuramlar','Sosyal öğrenme','Yapılandırmacılık','Bellek ve bilgi işleme','Unutma ve transfer','Güdülenme','Bireysel farklılıklar ve zekâ görüşleri']},
    {t:'Gelişim Psikolojisi', c:['Gelişimin temel ilkeleri','Bilişsel gelişim kuramları','Psikososyal gelişim','Ahlak gelişimi','Fiziksel ve motor gelişim','Dil gelişimi','Kişilik gelişimi','Çocukluk ve ergenlik dönemleri']},
    {t:'Rehberlik', c:['Rehberliğin ilke ve türleri','Rehberlik hizmet alanları','Bireyi tanıma yöntemleri','Psikolojik danışma yaklaşımları','Okulda rehberlik programı','Özel gereksinimli öğrenciler','Kriz ve istismar durumları','Etik ve gizlilik']},
    {t:'Eğitim ve Öğretim Teknolojileri', c:['Temel kavramlar','Materyal tasarım ilkeleri','Araç-gereç sınıflandırması','Dijital ve uzaktan öğrenme','Teknoloji entegrasyonu','Dijital vatandaşlık','Yapay zekâ uygulamaları']},
    {t:'Türk Millî Eğitim Sisteminin Genel Yapısı', c:['Amaç ve ilkeler','Eğitim kademeleri','Örgün ve yaygın eğitim','Bakanlık teşkilatı','Özel eğitim','Hayat boyu öğrenme','Denetim ve yönetim']},
    {t:'Türkiye Yüzyılı Maarif Modeli', c:['Modelin genel yaklaşımı','Erdem-değer-eylem','Beceriler','Eğilimler','Programlar arası bileşenler','Farklılaştırma','Öğrenme kanıtları']}
  ]},
  {id:'mevzuat', title:'Mevzuat', pct:'%10', q:8, groups:[
    {t:'Türkiye Cumhuriyeti Anayasası ve İnsan Hakları Hukuku', c:['Devletin nitelikleri','Temel hak ve özgürlükler','Sosyal ve ekonomik haklar','Eğitim hakkı','Yasama, yürütme, yargı','İdare ve kamu hizmeti','İnsan hakları belgeleri','Hakların sınırlanması']},
    {t:'1739 sayılı Millî Eğitim Temel Kanunu', c:['Genel amaçlar','Temel ilkeler','Eğitim sistemi ve kademeleri','Öğretmenlik mesleği','Okul-aile ilişkisi']},
    {t:'222 sayılı İlköğretim ve Eğitim Kanunu', c:['İlköğretimin kapsamı','Kayıt ve devam','Sorumluluklar','Kurumların açılması']},
    {t:'7528 sayılı Öğretmenlik Mesleği Kanunu', c:['Amaç ve kapsam','Hak ve ödevler','Mesleğe hazırlık ve akademi','Kariyer basamakları','Mesleki gelişim','Disiplin ve davranış ilkeleri']}
  ]}
];
SECTIONS.forEach(function(s){
  s.base = [];
  s.groups.forEach(function(g,gi){
    g.items = g.c.map(function(t,j){ return {id:s.id+'-g'+gi+'-'+j, text:t, custom:false}; });
    s.base = s.base.concat(g.items);
  });
});


var META={'sozel-yetenek':{i:'📖',h:265},'sayisal-yetenek':{i:'🔢',h:195},'tarih':{i:'🏛️',h:35},'turkiye-cografyasi':{i:'🌍',h:150},'egitim-bilimleri':{i:'🎓',h:325},'mevzuat':{i:'⚖️',h:12}};
var KEY='ags-konu-takip-v1',C=138.2;
function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function blank(){return{done:{},custom:{},t:0}}
function norm(o){var s=blank();if(o&&typeof o==='object'){if(o.done&&typeof o.done==='object')s.done=o.done;if(o.custom&&typeof o.custom==='object')s.custom=o.custom;s.t=+o.t||0}return s}
var st=blank();try{var r0=localStorage.getItem(KEY);if(r0)st=norm(JSON.parse(r0))}catch(e){}
var ref=null,tm;
function saveL(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function push(){if(!ref)return;clearTimeout(tm);tm=setTimeout(function(){try{ref.set({json:JSON.stringify(st)}).catch(function(){})}catch(e){}},500)}
function save(){st.t=Date.now();saveL();push()}
function gset(s){return s.groups.concat([{t:'Kendi konularım',custom:1}])}
function items(s,g){return g.custom?(st.custom[s.id]||[]).map(function(x){return{id:x.id,text:x.text,custom:1}}):g.items}
function cnt(a){var d=0;a.forEach(function(i){if(st.done[i.id])d++});return d}
function sc(s){var a=[];gset(s).forEach(function(g){a=a.concat(items(s,g))});return{d:cnt(a),n:a.length}}
function ring(){return '<svg class="rg" viewBox="0 0 52 52"><circle class="tr" cx="26" cy="26" r="22"/><circle class="pg" cx="26" cy="26" r="22"/></svg>'}
function wave(t){return t.split(' ').map(function(w){return '<span class="w">'+Array.from(w).map(function(ch,k){return '<i style="--k:'+k+'">'+esc(ch)+'</i>'}).join('')+'</span>'}).join(' ')}
function toast(m){var e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('show')},2000)}

/* Ana sayfa: açılan tablo */
function overall(){var D=0,N=0;SECTIONS.forEach(function(s){var c=sc(s);D+=c.d;N+=c.n});var p=N?D/N:0;
 $('ob').style.width=p*100+'%';$('rk').style.left=p*100+'%';$('ot').textContent='Görev ilerlemesi: '+D+'/'+N+' konu · %'+Math.round(p*100)}
function renderHome(){
 $('table').innerHTML=SECTIONS.map(function(s,i){var m=META[s.id],c=sc(s),p=c.n?c.d/c.n:0;
  return '<button class="cell'+(p>=1?' done':'')+'" type="button" data-s="'+s.id+'" style="--h:'+m.h+';--i:'+i+'"><span class="planet">'+m.i+'<i class="moon"></i></span>'+
  '<span class="ttl">'+wave(s.short||s.title)+'</span><span class="sub">'+s.pct+' ağırlık · ~'+s.q+' soru</span>'+
  '<span class="rgw">'+ring().replace('class="pg"','class="pg" style="stroke-dashoffset:'+(C*(1-p))+'"')+'<b>%'+Math.round(p*100)+'</b></span><span class="cnt">'+c.d+' / '+c.n+' konu</span></button>'});
 overall()}
$('table').onclick=function(e){var b=e.target.closest('.cell');if(b)openMap(b.dataset.s)};

/* Kavram haritası */
var cur,sel=0;
function pos(i,n){var a=-Math.PI/2+i*2*Math.PI/n;return{x:50+38*Math.cos(a),y:50+38*Math.sin(a)}}
function openMap(id){cur=SECTIONS.filter(function(s){return s.id===id})[0];var G=gset(cur);sel=0;
 for(var i=0;i<G.length;i++){var it=items(cur,G[i]);if(it.length&&cnt(it)<it.length){sel=i;break}}
 $('home').classList.remove('show');$('mapv').classList.add('show');scrollTo(0,0);$('mt').textContent=cur.title;drawMap();drawPanel()}
function drawMap(){var m=META[cur.id],G=gset(cur),n=G.length,br='',nd='',mz=$('mz');
 $('mapv').style.setProperty('--h',m.h);
 G.forEach(function(g,i){var q=pos(i,n),cx=(50+q.x)/2-(q.y-50)*.12,cy=(50+q.y)/2+(q.x-50)*.12;
  br+='<path class="brn" data-b="'+i+'" pathLength="1" style="--d:'+(i*70)+'ms" d="M50 50Q'+cx+' '+cy+' '+q.x+' '+q.y+'"/>';
  nd+='<button class="gn" type="button" data-g="'+i+'" title="'+esc(g.t)+'" style="left:'+q.x+'%;top:'+q.y+'%;--d:'+(300+i*70)+'ms">'+ring()+'<b data-gn></b><span class="gl">'+esc(g.t)+'</span></button>'});
 mz.innerHTML='<svg class="br" viewBox="0 0 100 100">'+br+'</svg>'+nd+'<div class="core"><span class="planet">'+m.i+'<i class="moon"></i></span><b>'+esc(cur.short||cur.title)+'</b><small data-cp></small></div>';
 upd()}
function upd(){var G=gset(cur),mz=$('mz');
 G.forEach(function(g,i){var it=items(cur,g),d=cnt(it),p=it.length?d/it.length:0,el=mz.querySelector('[data-g="'+i+'"]'),b=mz.querySelector('[data-b="'+i+'"]');if(!el)return;
  el.querySelector('.pg').style.strokeDashoffset=C*(1-p);el.querySelector('[data-gn]').textContent=it.length?d+'/'+it.length:'+';
  el.classList.toggle('full',it.length>0&&d===it.length);el.classList.toggle('sel',i===sel);if(b)b.classList.toggle('lit',p>0)});
 var s=sc(cur),cp=mz.querySelector('[data-cp]');if(cp)cp.textContent=s.d+'/'+s.n+' · %'+Math.round(s.n?s.d*100/s.n:0);
 var pc=$('panel').querySelector('[data-pc]');if(pc){var it2=items(cur,G[sel]);pc.textContent=cnt(it2)+'/'+it2.length+' konu'}
 overall()}
function drawPanel(){var g=gset(cur)[sel],it=items(cur,g),h='<div class="ph"><div><h3>'+esc(g.t)+'</h3><small data-pc></small></div>'+(it.length?'<button class="btn" type="button" data-all>Hepsi</button>':'')+'</div>';
 if(!it.length)h+='<p class="empty">Henüz konu yok. Aşağıdan kendi konunu ekle.</p>';
 h+='<ul class="lv">'+it.map(function(x,j){return '<li class="leaf'+(st.done[x.id]?' on':'')+'" data-id="'+x.id+'" style="--j:'+j+'"><span class="bx"></span><span class="lt">'+esc(x.text)+'</span>'+(x.custom?'<button class="dl" type="button" data-del="'+x.id+'" aria-label="Sil">✕</button>':'')+'</li>'}).join('')+'</ul>';
 if(g.custom)h+='<form class="add"><input maxlength="120" placeholder="Kendi konunu ekle…" aria-label="Konu ekle"><button class="btn">Ekle</button></form>';
 $('panel').innerHTML=h;upd();requestAnimationFrame(function(){requestAnimationFrame(links)})}
function links(){var stg=$('stage'),n=$('mz').querySelector('.gn.sel'),ov=$('ov');if(!n||!$('mapv').classList.contains('show')){ov.innerHTML='';return}
 var g=stg.getBoundingClientRect(),a=n.getBoundingClientRect(),x0=a.left+a.width/2-g.left,y0=a.top+a.height/2-g.top,h='';
 $('panel').querySelectorAll('.leaf').forEach(function(li,j){var r=li.querySelector('.bx').getBoundingClientRect(),x1=r.left-g.left,y1=r.top+r.height/2-g.top,dx=(x1-x0)*.55;
  h+='<path class="lk'+(li.classList.contains('on')?' on':'')+'" pathLength="1" style="--d:'+(j*45)+'ms" d="M'+x0+' '+y0+'C'+(x0+dx)+' '+y0+' '+(x1-dx)+' '+y1+' '+x1+' '+y1+'"/>'});
 ov.setAttribute('viewBox','0 0 '+g.width+' '+g.height);ov.innerHTML=h}
addEventListener('resize',function(){clearTimeout(links.t);links.t=setTimeout(links,150)});

$('mz').onclick=function(e){var b=e.target.closest('.gn');if(b){sel=+b.dataset.g;upd();drawPanel()}};
function setLeaf(li,on){var id=li.dataset.id;if(on)st.done[id]=1;else delete st.done[id];li.classList.toggle('on',on)}
function after(g,wasDone,wasSub,li){var it=items(cur,g),d=cnt(it),s=sc(cur),h=META[cur.id].h;
 save();upd();var i=Array.prototype.indexOf.call($('panel').querySelectorAll('.leaf'),li),ov=$('ov').children;
 $('panel').querySelectorAll('.leaf').forEach(function(l,j){if(ov[j])ov[j].classList.toggle('on',l.classList.contains('on'))});
 if(it.length&&d===it.length&&!wasDone){burst(innerWidth/2,innerHeight/3,h,60);toast('🌟 '+g.t+' tamamlandı')}
 if(s.n&&s.d===s.n&&!wasSub){for(var k=0;k<6;k++)setTimeout(function(){burst(Math.random()*innerWidth,Math.random()*innerHeight*.6,Math.random()*360,50)},k*250);toast('🚀 '+cur.title+' bitti!')}}
$('panel').onclick=function(e){var g=gset(cur)[sel],it=items(cur,g),wasDone=it.length&&cnt(it)===it.length,ws=sc(cur),wasSub=ws.n&&ws.d===ws.n;
 if(e.target.closest('[data-all]')){var all=cnt(it)===it.length;$('panel').querySelectorAll('.leaf').forEach(function(l,j){setLeaf(l,!all);if(!all&&j%2===0){var r=l.querySelector('.bx').getBoundingClientRect();burst(r.left+14,r.top+14,META[cur.id].h,6)}});after(g,wasDone,wasSub,null);return}
 var dl=e.target.closest('[data-del]');if(dl){var id=dl.dataset.del;st.custom[cur.id]=(st.custom[cur.id]||[]).filter(function(x){return x.id!==id});delete st.done[id];save();drawPanel();return}
 var li=e.target.closest('.leaf');if(li){var on=!li.classList.contains('on');setLeaf(li,on);if(on){var r2=li.querySelector('.bx').getBoundingClientRect();burst(r2.left+14,r2.top+14,META[cur.id].h,18)}after(g,wasDone,wasSub,li)}};
$('panel').onsubmit=function(e){e.preventDefault();var f=e.target,v=f.querySelector('input').value.trim();if(!v)return;
 (st.custom[cur.id]=st.custom[cur.id]||[]).push({id:cur.id+'-c'+Date.now().toString(36)+Math.floor(Math.random()*999),text:v});save();drawPanel()};
function goHome(){$('mapv').classList.remove('show');$('home').classList.add('show');$('ov').innerHTML='';renderHome()}
$('back').onclick=goHome;
addEventListener('keydown',function(e){if(e.key==='Escape'){if($('md').classList.contains('show'))$('md').classList.remove('show');else if($('mapv').classList.contains('show'))goHome()}});

/* Yedek ve eşitleme */
function refresh(){overall();if($('mapv').classList.contains('show')){drawMap();drawPanel()}else renderHome()}
$('bk').onclick=function(){$('md').classList.add('show')};$('cl').onclick=function(){$('md').classList.remove('show')};
$('mk').onclick=function(){var c=$('cd');c.value='AGS1:'+encodeURIComponent(JSON.stringify(st));c.select();try{navigator.clipboard.writeText(c.value);toast('Kod kopyalandı')}catch(e){toast('Kodu seçip kopyala')}};
$('ld').onclick=function(){var v=$('cd').value.trim();if(v.indexOf('AGS1:')!==0)return toast('Kod geçersiz');try{st=norm(JSON.parse(decodeURIComponent(v.slice(5))));st.t=Date.now();saveL();push();refresh();toast('İlerleme yüklendi')}catch(e){toast('Kod okunamadı')}};
$('rs').onclick=function(){var b=this;if(b.dataset.a){st.done={};save();refresh();b.dataset.a='';b.textContent='Tüm işaretleri sıfırla';toast('Sıfırlandı');return}b.dataset.a=1;b.textContent='Emin misin? Tekrar dokun';setTimeout(function(){b.dataset.a='';b.textContent='Tüm işaretleri sıfırla'},3000)};
try{window.claude&&window.claude.use&&window.claude.use('db').then(function(db){if(!db)return;ref=db.doc('ags/progress');
 ref.onSnapshot(function(sn){$('sy').textContent='Cihazlar arası eşitleme açık.';if(sn.exists){try{var r=norm(JSON.parse(sn.data().json));if(r.t>st.t){st=r;saveL();refresh()}else if(r.t<st.t)push()}catch(e){}}else if(st.t)push()},function(){})}).catch(function(){})}catch(e){}

/* Uzay: yıldızlar, kayan yıldızlar, patlama parçacıkları */
var sk=$('sky'),fxc=$('fx'),cs=sk.getContext('2d'),cf=fxc.getContext('2d'),W,H,S=[],SH=[],P=[],mx=0,my=0,RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rs(){W=sk.width=fxc.width=innerWidth;H=sk.height=fxc.height=innerHeight;S=[];var n=Math.min(280,W*H/5500);for(var i=0;i<n;i++)S.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2.2+.3,p:Math.random()*6.28,h:Math.random()<.22?190+Math.random()*100:0})}
rs();addEventListener('resize',rs);
addEventListener('pointermove',function(e){mx=e.clientX/W-.5;my=e.clientY/H-.5});
function burst(x,y,h,n){for(var i=0;i<n;i++){var a=Math.random()*6.28,v=1.5+Math.random()*5;P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,l:1,s:2+Math.random()*3.5,h:h+Math.random()*70-35})}}
var lastSh=0;
function loop(t){if(RM)t=0;cs.clearRect(0,0,W,H);
 S.forEach(function(s){var x=((s.x+t*.006*s.z+mx*s.z*26)%W+W)%W,y=((s.y+my*s.z*26)%H+H)%H,a=.35+.65*(.5+.5*Math.sin(t/650*s.z+s.p)),c=s.h?'hsla('+s.h+',90%,82%,':'rgba(255,255,255,';
  cs.fillStyle=c+a+')';cs.beginPath();cs.arc(x,y,s.z*.7,0,6.28);cs.fill();
  if(s.z>2.3){cs.strokeStyle=c+a*.5+')';cs.lineWidth=1;cs.beginPath();cs.moveTo(x-6*s.z/2,y);cs.lineTo(x+6*s.z/2,y);cs.moveTo(x,y-6*s.z/2);cs.lineTo(x,y+6*s.z/2);cs.stroke()}});
 if(!RM&&t-lastSh>3500+Math.random()*3000){lastSh=t;SH.push({x:Math.random()*W,y:Math.random()*H*.5,vx:9+Math.random()*6,vy:4+Math.random()*3,l:1})}
 SH=SH.filter(function(s){s.x+=s.vx;s.y+=s.vy;s.l-=.018;if(s.l<=0)return false;var g=cs.createLinearGradient(s.x,s.y,s.x-s.vx*9,s.y-s.vy*9);g.addColorStop(0,'rgba(255,255,255,'+s.l+')');g.addColorStop(1,'rgba(255,255,255,0)');cs.strokeStyle=g;cs.lineWidth=2;cs.beginPath();cs.moveTo(s.x,s.y);cs.lineTo(s.x-s.vx*9,s.y-s.vy*9);cs.stroke();return true});
 cf.clearRect(0,0,W,H);
 P=P.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.vx*=.985;p.l-=.02;if(p.l<=0)return false;cf.fillStyle='hsla('+p.h+',95%,72%,'+p.l+')';cf.shadowColor='hsl('+p.h+',95%,65%)';cf.shadowBlur=10;
  cf.beginPath();cf.arc(p.x,p.y,p.s*p.l+.5,0,6.28);cf.fill();return true});cf.shadowBlur=0;
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
renderHome();
</script>
